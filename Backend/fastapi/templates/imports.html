{% extends "base.html" %}
{% block title %}Failed Imports · Telegram Stremio{% endblock %}

{% block content %}
<section class="space-y-5">
  <div class="glass-panel rounded-3xl p-5 sm:p-6">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-xl sm:text-2xl font-extrabold flex items-center gap-2">
          <i class="fa-solid fa-triangle-exclamation text-amber-400"></i>
          Failed Imports
        </h1>
        <p class="text-sm text-text-secondary mt-1">
          Files that could not be indexed automatically. Search the correct title and map the file to it.
        </p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <select id="status-filter" class="field px-3 py-2 text-sm">
          <option value="pending">Pending</option>
          <option value="fixed">Fixed</option>
          <option value="ignored">Ignored</option>
          <option value="all">All</option>
        </select>
        <input id="search-input" class="field px-3 py-2 text-sm w-48 sm:w-64" placeholder="Filter by name or caption">
        <label class="flex items-center gap-2 text-sm text-text-secondary cursor-pointer select-none px-1">
          <input id="select-all" type="checkbox" onchange="toggleSelectAll(this)"
                 style="width:16px;height:16px;margin:0;accent-color:var(--primary);cursor:pointer">
          Select all
        </label>
        <button class="btn-ghost px-4 py-2 text-sm" onclick="loadImports()">
          <i class="fa-solid fa-rotate"></i> Refresh
        </button>
        <button id="retry-all-btn" class="btn-primary px-4 py-2 text-sm" onclick="retryAllPending()">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Retry all pending
        </button>
      </div>
    </div>
    <p id="retry-all-status" class="text-xs text-text-secondary mt-3"></p>
  </div>

  <div id="imports-list" class="space-y-3"></div>

  <div id="bulk-bar" class="hidden glass-panel rounded-2xl p-3 flex flex-wrap items-center justify-between gap-3 sticky bottom-2 z-10">
    <span id="bulk-count" class="text-xs text-text-secondary"></span>
    <div class="flex flex-wrap gap-2">
      <button class="btn-primary px-3 py-2 text-xs" onclick="openBulkMap()">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Map title
      </button>
      <button class="btn-ghost px-3 py-2 text-xs" onclick="bulkQuality()">
        <i class="fa-solid fa-gauge-high"></i> Set quality
      </button>
      <button class="btn-ghost px-3 py-2 text-xs" onclick="bulkIgnore()">
        <i class="fa-solid fa-ban"></i> Ignore
      </button>
      <button class="btn-ghost px-3 py-2 text-xs" onclick="clearBulk()">Clear</button>
    </div>
  </div>

  <div class="flex items-center justify-between px-1">
    <button id="prev-btn" class="btn-ghost px-4 py-2 text-sm" onclick="changePage(-1)">Previous</button>
    <span id="page-label" class="text-xs text-text-secondary"></span>
    <button id="next-btn" class="btn-ghost px-4 py-2 text-sm" onclick="changePage(1)">Next</button>
  </div>
</section>

<div id="map-modal" class="fixed inset-0 z-[80] hidden items-end sm:items-center justify-center p-0 sm:p-4" style="background:rgba(0,0,0,.55)">
  <div class="glass-panel rounded-t-3xl sm:rounded-3xl w-full max-w-2xl flex flex-col overflow-hidden" style="max-height:92dvh">
    <div class="flex items-start justify-between gap-3 px-4 sm:px-5 pt-4 sm:pt-5 pb-2 shrink-0">
      <div class="min-w-0">
        <h2 class="text-lg font-extrabold">Map to a title</h2>
        <p id="map-file" class="text-xs text-text-secondary mt-1 break-all"></p>
      </div>
      <button class="btn-ghost w-9 h-9 shrink-0" onclick="closeMap()" title="Close"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="px-4 sm:px-5 overflow-y-auto flex-1 min-h-0" style="overscroll-behavior:contain">
      <div class="grid sm:grid-cols-[140px_minmax(0,1fr)] gap-3 mt-2">
        <select id="map-type" class="field px-3 py-2 text-sm" onchange="runSearch()">
          <option value="movie">Movie</option>
          <option value="tv">TV Show</option>
        </select>
        <div class="flex gap-2">
          <input id="map-query" class="field px-3 py-2 text-sm flex-1 min-w-0" placeholder="Title, IMDb id/link or TMDB id/link"
                 onkeydown="if(event.key==='Enter'){event.preventDefault();runSearch()}">
          <button class="btn-primary px-4 py-2 text-sm shrink-0" onclick="runSearch()">Search</button>
        </div>
      </div>

      <div class="grid sm:grid-cols-2 gap-3 mt-3" id="episode-fields" style="display:none">
        <input id="map-season" type="number" min="0" class="field px-3 py-2 text-sm" placeholder="Season (optional)">
        <input id="map-episode" type="number" min="0" class="field px-3 py-2 text-sm" placeholder="Episode (optional)">
      </div>

      <div class="mt-3">
        <input id="map-quality" class="field px-3 py-2 text-sm w-full"
               placeholder="Quality if the file has none (e.g. 1080p)"
               oninput="mapQuality = this.value">
      </div>

      <label class="mt-3 flex items-start gap-2 text-xs text-text-secondary">
        <input id="map-rename-caption" type="checkbox" checked class="mt-0.5">
        <span>Rename the Telegram caption to <b>1080p.Title.S01E01.mkv</b> (series only), so future scans find it.</span>
      </label>

      <div id="map-results" class="mt-4 space-y-2 pb-2"></div>
    </div>

    <div class="flex justify-end gap-2 px-4 sm:px-5 py-3 border-t border-border shrink-0" style="background:var(--card)">
      <button class="btn-ghost px-4 py-2 text-sm" onclick="closeMap()">Cancel</button>
      <button id="map-confirm" class="btn-primary px-4 py-2 text-sm" disabled onclick="confirmMap()">Map this file</button>
    </div>
  </div>
</div>

<div id="quality-modal" class="fixed inset-0 z-[80] hidden items-end sm:items-center justify-center p-0 sm:p-4" style="background:rgba(0,0,0,.55)">
  <div class="glass-panel rounded-t-3xl sm:rounded-3xl w-full max-w-lg flex flex-col overflow-hidden" style="max-height:92dvh">
    <div class="flex items-start justify-between gap-3 px-4 sm:px-5 pt-4 sm:pt-5 pb-2 shrink-0">
      <div class="min-w-0">
        <h2 class="text-lg font-extrabold">Add quality</h2>
        <p id="quality-file" class="text-xs text-text-secondary mt-1 break-all"></p>
      </div>
      <button class="btn-ghost w-9 h-9 shrink-0" onclick="closeQuality()" title="Close"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="px-4 sm:px-5 overflow-y-auto flex-1 min-h-0" style="overscroll-behavior:contain">
      <div class="mt-2">
        <label class="text-[10px] uppercase text-text-secondary font-bold mb-2 block">Quality</label>
        <div class="flex flex-wrap gap-2 mb-3">
          <button type="button" class="btn-ghost px-3 py-1.5 text-xs" onclick="pickQuality('480p')">480p</button>
          <button type="button" class="btn-ghost px-3 py-1.5 text-xs" onclick="pickQuality('720p')">720p</button>
          <button type="button" class="btn-ghost px-3 py-1.5 text-xs" onclick="pickQuality('1080p')">1080p</button>
          <button type="button" class="btn-ghost px-3 py-1.5 text-xs" onclick="pickQuality('2160p')">2160p</button>
        </div>
        <input id="quality-input" class="field px-3 py-2 text-sm w-full" placeholder="e.g. 1080p"
               onkeydown="if(event.key==='Enter'){event.preventDefault();confirmQuality()}">
      </div>

      <label class="flex items-start gap-2 mt-4 text-xs text-text-secondary">
        <input id="quality-edit-caption" type="checkbox" checked class="mt-0.5">
        <span>Add the quality to the Telegram caption (before the extension), so future scans detect it.</span>
      </label>

      <p id="quality-hint" class="text-xs text-text-secondary mt-3 pb-2"></p>
    </div>

    <div class="flex justify-end gap-2 px-4 sm:px-5 py-3 border-t border-border shrink-0" style="background:var(--card)">
      <button class="btn-ghost px-4 py-2 text-sm" onclick="closeQuality()">Cancel</button>
      <button id="quality-confirm" class="btn-primary px-4 py-2 text-sm" onclick="confirmQuality()">Save quality</button>
    </div>
  </div>
</div>

<script>
(function () {
  let page = 1;
  let pageSize = 25;
  let total = 0;
  let currentId = null;
  let selectedId = null;
  let qualityItemId = null;
  let mapQuality = '';
  let bulkMode = false;
  let bulkIds = new Set();

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  function fmtDate(ts) {
    if (!ts) return '';
    try { return new Date(ts * 1000).toLocaleString(); } catch (e) { return ''; }
  }

  function reasonLabel(reason) {
    const labels = {
      no_quality: 'No quality detected',
      no_title: 'No title detected',
      not_found: 'Title not found',
      invalid_episode: 'Invalid season/episode',
      combined: 'Combined release',
      multipart: 'Multipart video',
      error: 'Parser error',
      metadata_failed: 'Metadata failed'
    };
    return labels[reason] || reason || 'Unknown';
  }

  window.loadImports = async function () {
    const status = document.getElementById('status-filter').value;
    const search = document.getElementById('search-input').value.trim();
    const box = document.getElementById('imports-list');
    box.innerHTML = '<div class="glass-panel rounded-2xl p-6 text-sm text-text-secondary">Loading…</div>';
    try {
      const url = `/api/admin/imports?status=${encodeURIComponent(status)}&page=${page}&page_size=${pageSize}&search=${encodeURIComponent(search)}`;
      const res = await fetch(url);
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Request failed');
      total = data.total || 0;
      render(data.items || []);
    } catch (e) {
      box.innerHTML = `<div class="glass-panel rounded-2xl p-6 text-sm text-red-400">${esc(e.message || e)}</div>`;
    }
  };

  function fmtBytes(bytes) {
    const n = Number(bytes) || 0;
    if (!n) return '';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0, v = n;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return `${v.toFixed(v >= 100 || i === 0 ? 0 : 1)} ${units[i]}`;
  }

  function render(items) {
    const box = document.getElementById('imports-list');
    if (!items.length) {
      box.innerHTML = '<div class="glass-panel rounded-2xl p-6 text-sm text-text-secondary">No failed imports here.</div>';
    } else {
      const groups = [];
      const byKey = {};
      items.forEach(function (it) {
        const base = it.part_base || '';
        const key = String(it.chat_id) + '::' + (base || it.id);
        if (!byKey[key]) {
          byKey[key] = { key: key, items: [] };
          groups.push(byKey[key]);
        }
        byKey[key].items.push(it);
      });
      groups.forEach(function (g) {
        g.items.sort(function (a, b) { return (a.part_number || 0) - (b.part_number || 0); });
      });

      box.innerHTML = groups.map(function (g) {
        const pending = g.items.filter(function (i) { return i.status === 'pending'; });
        const lead = pending.length ? pending[0] : g.items[0];
        const label = lead.file_name || lead.caption || '';
        const isPending = pending.length > 0;
        // Show only the action that matches the failure: a missing quality can't
        // be fixed by mapping a title, and vice versa.
        const isQualityIssue = (lead.reason === 'no_quality');
        const canMap = isPending && !isQualityIssue;
        const canQuality = isPending && isQualityIssue;

        const nums = g.items.map(function (i) { return i.part_number || 0; }).filter(Boolean);
        const missing = [];
        if (nums.length) {
          for (let n = Math.min.apply(null, nums); n <= Math.max.apply(null, nums); n++) {
            if (nums.indexOf(n) === -1) missing.push(n);
          }
        }
        const chips = nums.length
          ? g.items.map(function (i) {
              const ok = i.status === 'fixed';
              return `<span class="badge" title="${esc(i.status || '')}" style="${ok ? 'background:color-mix(in srgb,#22c55e 18%,transparent)' : ''}">P${esc(i.part_number)}</span>`;
            }).join(' ')
          : '';
        const missingNote = missing.length
          ? `<span class="badge" style="background:color-mix(in srgb,#ef4444 18%,transparent)">Faltan partes: ${missing.join(', ')}</span>`
          : '';
        const totalBytes = g.items.reduce(function (a, i) { return a + (i.size_bytes || 0); }, 0);
        const sizeText = g.items.length > 1 ? fmtBytes(totalBytes) : (lead.size_label || '');
        const link = lead.chat_id && lead.msg_id
          ? `<a class="text-xs" style="color:var(--primary)" target="_blank" rel="noopener"
                href="https://t.me/c/${encodeURIComponent(String(lead.chat_id).replace('-100', ''))}/${lead.msg_id}">
                <i class="fa-brands fa-telegram"></i> open in Telegram</a>`
          : '';

        return `<div class="glass-panel rounded-2xl p-4">
          <div class="flex items-start gap-3">
            ${isPending ? `<label class="pt-1 cursor-pointer" title="Select this file">
              <input type="checkbox" class="bulk-check" data-id="${esc(lead.id)}" ${bulkIds.has(String(lead.id)) ? 'checked' : ''} onchange="toggleBulk(this)"
                     style="width:16px;height:16px;margin:0;accent-color:var(--primary);cursor:pointer">
            </label>` : `<span style="flex:0 0 16px"></span>`}
            <div class="flex-1 min-w-0 flex flex-wrap items-start justify-between gap-3">
            <div class="min-w-0">
              <p class="font-bold text-sm break-all"><span class="text-[10px] uppercase text-text-secondary mr-1">file</span>${esc(lead.file_name || '(no filename)')}</p>
              <p class="text-xs text-text-secondary mt-1 break-all"><span class="text-[10px] uppercase mr-1">caption</span>${esc(lead.caption || '—')}</p>
              <div class="flex flex-wrap items-center gap-3 mt-2 text-[11px] text-text-secondary">
                <span class="badge">${esc(reasonLabel(lead.reason))}</span>
                ${g.items.length > 1 ? `<span class="badge">${g.items.length} partes</span>` : ''}
                ${chips}
                ${missingNote}
                ${lead.quality ? `<span class="badge" style="background:color-mix(in srgb,var(--primary) 18%,transparent)">${esc(lead.quality)}</span>` : ''}
                <span>${esc(sizeText)}</span>
                <span>attempts: ${esc(lead.attempts || 0)}</span>
                <span>${esc(fmtDate(lead.created_at))}</span>
                ${lead.fixed_by ? `<span>by ${esc(lead.fixed_by)}</span>` : ''}
                ${link}
              </div>
            </div>
            <div class="flex flex-wrap items-center justify-end gap-2">
              ${canMap ? `<button class="btn-primary px-3 py-2 text-xs" data-id="${esc(lead.id)}" data-label="${esc(label)}" data-quality="${esc(lead.quality || '')}" onclick="openMap(this)">
                <i class="fa-solid fa-wand-magic-sparkles"></i> ${g.items.length > 1 ? 'Map file' : 'Map'}
              </button>` : ''}
              ${canQuality ? `<button class="btn-ghost px-3 py-2 text-xs" data-id="${esc(lead.id)}" data-label="${esc(label)}" data-quality="${esc(lead.quality || '')}" onclick="openQuality(this)">
                <i class="fa-solid fa-gauge-high"></i> ${lead.quality ? 'Change quality' : 'Add quality'}
              </button>` : ''}
              ${isPending ? `<button class="btn-ghost px-3 py-2 text-xs" data-id="${esc(lead.id)}" onclick="ignoreImport(this)">Ignore</button>` : ''}
            </div>
            </div>
          </div>
        </div>`;
      }).join('');
    }
    const pages = Math.max(1, Math.ceil(total / pageSize));
    document.getElementById('page-label').textContent = `Page ${page} of ${pages} · ${total} item(s)`;
    document.getElementById('prev-btn').disabled = page <= 1;
    document.getElementById('next-btn').disabled = page >= pages;
    const checks = Array.from(document.querySelectorAll('.bulk-check'));
    const allBox = document.getElementById('select-all');
    if (allBox) allBox.checked = checks.length > 0 && checks.every(function (c) { return c.checked; });
    updateBulkBar();
  }

  window.changePage = function (delta) {
    const pages = Math.max(1, Math.ceil(total / pageSize));
    const next = Math.min(pages, Math.max(1, page + delta));
    if (next === page) return;
    page = next;
    loadImports();
  };

  // Turn a raw file label into a clean search title + detected season/episode.
  function parseMapLabel(label) {
    const raw = String(label || '');
    let q = raw
      .replace(/\.(?:mkv|mp4|avi|ts|m4v|mov|wmv|webm|flv|m2ts|mpg|mpeg)\.\d{2,3}$/i, '')
      .replace(/\.(?:mkv|mp4|avi|ts|m4v|mov|wmv|webm|flv|m2ts|mpg|mpeg)$/i, '')
      .replace(/[._]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();

    const se = q.match(/\bS(\d{1,3})\s*E(\d{1,4})\b/i)
      || q.match(/(?:^|[^a-z0-9])T\s*(\d{1,2})\s*[._\s-]*E\s*(\d{1,4})(?![0-9])/i)
      || q.match(/(?:^|[^a-z0-9])(\d{1,2})\s*x\s*(\d{1,3})(?![0-9])/i);
    const season = se ? parseInt(se[1], 10) : null;
    const episode = se ? parseInt(se[2], 10) : null;
    if (se) q = q.slice(0, se.index).trim();

    q = q
      .replace(/\b(?:2160p|1080p|720p|480p|4k|uhd|web[ -]?dl|webrip|bluray|blu[ -]?ray|bdrip|brrip|hdtv|dvdrip|x264|x265|h\.?264|h\.?265|hevc|aac|ac3|ddp?|latino|castellano|español|dual|multi|esub|subs?|hdlatino|vip)\b/gi, ' ')
      .replace(/\s+/g, ' ')
      .trim();

    return { query: q || raw, isTv: !!se, season, episode, quality: detectQuality(raw) };
  }

  function detectQuality(text) {
    const m = String(text || '').match(/\b(2160p|1440p|1080p|720p|576p|480p|360p)\b/i);
    if (m) return m[1].toLowerCase();
    if (/\b(4k|uhd)\b/i.test(text)) return '2160p';
    if (/\bfhd\b/i.test(text)) return '1080p';
    return '';
  }

  window.openMap = function (btn) {
    const id = btn.dataset.id;
    const label = btn.dataset.label || '';
    bulkMode = false;
    currentId = id;
    selectedId = null;
    document.getElementById('map-file').textContent = label;

    const parsed = parseMapLabel(label);
    // The saved quality wins; otherwise take the one declared in the file name.
    mapQuality = btn.dataset.quality || parsed.quality || '';
    document.getElementById('map-quality').value = mapQuality;
    document.getElementById('map-query').value = parsed.query;
    document.getElementById('map-type').value = parsed.isTv ? 'tv' : 'movie';
    document.getElementById('map-results').innerHTML = '';
    document.getElementById('map-confirm').disabled = true;
    document.getElementById('map-season').value = parsed.season != null ? parsed.season : '';
    document.getElementById('map-episode').value = parsed.episode != null ? parsed.episode : '';
    toggleEpisodeFields();
    const modal = document.getElementById('map-modal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    document.body.style.overflow = 'hidden';
    runSearch();
  };

  window.closeMap = function () {
    const modal = document.getElementById('map-modal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    document.body.style.overflow = '';
    currentId = null;
    selectedId = null;
    bulkMode = false;
  };

  window.toggleBulk = function (cb) {
    const id = String(cb.dataset.id || '');
    if (!id) return;
    if (cb.checked) bulkIds.add(id); else bulkIds.delete(id);
    updateBulkBar();
  };

  function updateBulkBar() {
    const bar = document.getElementById('bulk-bar');
    document.getElementById('bulk-count').textContent = `${bulkIds.size} file(s) selected`;
    bar.classList.toggle('hidden', bulkIds.size === 0);
    bar.classList.toggle('flex', bulkIds.size !== 0);
  }

  window.clearBulk = function () {
    bulkIds.clear();
    document.querySelectorAll('.bulk-check').forEach(function (c) { c.checked = false; });
    const all = document.getElementById('select-all');
    if (all) all.checked = false;
    updateBulkBar();
  };

  window.toggleSelectAll = function (cb) {
    document.querySelectorAll('.bulk-check').forEach(function (c) {
      c.checked = cb.checked;
      const id = String(c.dataset.id || '');
      if (!id) return;
      if (cb.checked) bulkIds.add(id); else bulkIds.delete(id);
    });
    updateBulkBar();
  };

  async function bulkPost(path, body) {
    const ids = Array.from(bulkIds);
    let ok = 0, fail = 0;
    for (const id of ids) {
      try {
        const res = await fetch(`/api/admin/imports/${encodeURIComponent(id)}${path}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body || {})
        });
        if (res.ok) ok++; else fail++;
      } catch (e) { fail++; }
    }
    clearBulk();
    loadImports();
    return { ok: ok, fail: fail };
  }

  window.bulkQuality = async function () {
    if (!bulkIds.size) return;
    const quality = prompt('Quality for the selected files (e.g. 1080p):', '1080p');
    if (!quality) return;
    const r = await bulkPost('/quality', { quality: quality, edit_caption: true, retry: true });
    alert(`Quality saved on ${r.ok} file(s).` + (r.fail ? ` ${r.fail} failed.` : ''));
  };

  window.bulkIgnore = async function () {
    if (!bulkIds.size) return;
    if (!confirm(`Ignore ${bulkIds.size} selected file(s)?`)) return;
    const r = await bulkPost('/ignore', {});
    alert(`Ignored ${r.ok} file(s).` + (r.fail ? ` ${r.fail} failed.` : ''));
  };

  window.openBulkMap = function () {
    if (!bulkIds.size) return;
    bulkMode = true;
    currentId = null;
    selectedId = null;
    mapQuality = '';
    document.getElementById('map-file').textContent =
      `${bulkIds.size} file(s) selected — each one keeps its own season/episode from its name`;
    document.getElementById('map-quality').value = '';
    document.getElementById('map-query').value = '';
    document.getElementById('map-type').value = 'tv';
    document.getElementById('map-results').innerHTML = '';
    document.getElementById('map-confirm').disabled = true;
    document.getElementById('episode-fields').style.display = 'none';
    const modal = document.getElementById('map-modal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    document.body.style.overflow = 'hidden';
  };

  function toggleEpisodeFields() {
    const isTv = document.getElementById('map-type').value === 'tv';
    document.getElementById('episode-fields').style.display = bulkMode ? 'none' : (isTv ? '' : 'none');
  }

  window.runSearch = async function () {
    toggleEpisodeFields();
    const type = document.getElementById('map-type').value;
    const query = document.getElementById('map-query').value.trim();
    const box = document.getElementById('map-results');
    selectedId = null;
    document.getElementById('map-confirm').disabled = true;
    if (!query) { box.innerHTML = ''; return; }
    box.innerHTML = '<p class="text-xs text-text-secondary">Searching…</p>';
    try {
      const res = await fetch(`/api/media/rescan/search?media_type=${encodeURIComponent(type)}&query=${encodeURIComponent(query)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Search failed');
      const results = data.results || [];
      if (!results.length) { box.innerHTML = '<p class="text-xs text-text-secondary">No results.</p>'; return; }
      box.innerHTML = results.map(function (r, i) {
        const id = r.selected_id || r.imdb_id || (r.tmdb_id ? String(r.tmdb_id) : '');
        const year = r.year || r.release_year || '';
        const poster = r.poster || '';
        return `<button type="button" class="w-full text-left surface-card p-3 flex items-center gap-3 hover:opacity-90"
                  onclick="pickResult(this)" data-id="${esc(id)}">
          ${poster ? `<img src="${esc(poster)}" alt="" style="width:42px;height:62px;object-fit:cover;border-radius:.5rem">` : ''}
          <span class="min-w-0">
            <span class="block text-sm font-bold truncate">${esc(r.title || r.name || 'Unknown')}</span>
            <span class="block text-xs text-text-secondary">${esc(year)} · ${esc(id)}</span>
          </span>
        </button>`;
      }).join('');
    } catch (e) {
      box.innerHTML = `<p class="text-xs text-red-400">${esc(e.message || e)}</p>`;
    }
  };

  window.pickResult = function (el) {
    const id = el ? el.dataset.id : '';
    selectedId = id;
    document.querySelectorAll('#map-results [data-id]').forEach(function (n) {
      n.style.outline = '';
    });
    if (el) el.style.outline = '2px solid var(--primary)';
    document.getElementById('map-confirm').disabled = !id;
  };

  window.confirmMap = async function () {
    if (!selectedId) return;
    const btn = document.getElementById('map-confirm');
    btn.disabled = true;

    if (bulkMode) {
      const ids = Array.from(bulkIds);
      const type = document.getElementById('map-type').value;
      const quality = (mapQuality || '').trim() || null;
      const rename = !!(document.getElementById('map-rename-caption') || {}).checked;
      let ok = 0, fail = 0;
      for (let i = 0; i < ids.length; i++) {
        btn.textContent = `Mapping ${i + 1}/${ids.length}…`;
        try {
          const res = await fetch(`/api/admin/imports/${encodeURIComponent(ids[i])}/map`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              selected_id: selectedId,
              media_type: type,
              season: null,
              episode: null,
              quality: quality,
              rename_caption: rename
            })
          });
          if (res.ok) ok++; else fail++;
        } catch (e) { fail++; }
      }
      clearBulk();
      closeMap();
      btn.disabled = false;
      btn.textContent = 'Map this file';
      loadImports();
      alert(`Mapped ${ok} file(s).` + (fail ? ` ${fail} failed.` : ''));
      return;
    }

    if (!currentId) return;
    btn.textContent = 'Mapping…';
    try {
      const seasonRaw = document.getElementById('map-season').value;
      const episodeRaw = document.getElementById('map-episode').value;
      const body = {
        selected_id: selectedId,
        media_type: document.getElementById('map-type').value,
        season: seasonRaw === '' ? null : Number(seasonRaw),
        episode: episodeRaw === '' ? null : Number(episodeRaw),
        quality: (mapQuality || '').trim() || null,
        rename_caption: !!(document.getElementById('map-rename-caption') || {}).checked
      };
      const res = await fetch(`/api/admin/imports/${encodeURIComponent(currentId)}/map`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Mapping failed');
      closeMap();
      loadImports();
    } catch (e) {
      alert(e.message || String(e));
      btn.disabled = false;
      btn.textContent = 'Map this file';
    }
  };

  window.ignoreImport = async function (btn) {
    const id = btn.dataset.id;
    if (!id || !confirm('Ignore this import?')) return;
    try {
      const res = await fetch(`/api/admin/imports/${encodeURIComponent(id)}/ignore`, { method: 'POST' });
      if (!res.ok) {
        const data = await res.json().catch(function () { return {}; });
        throw new Error(data.detail || 'Request failed');
      }
      loadImports();
    } catch (e) {
      alert(e.message || String(e));
    }
  };

  window.openQuality = function (btn) {
    qualityItemId = btn.dataset.id;
    document.getElementById('quality-file').textContent = btn.dataset.label || '';
    document.getElementById('quality-input').value = btn.dataset.quality || '';
    document.getElementById('quality-edit-caption').checked = true;
    document.getElementById('quality-hint').textContent =
      'After saving we retry the automatic match with this quality.';
    const modal = document.getElementById('quality-modal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    document.body.style.overflow = 'hidden';
    document.getElementById('quality-input').focus();
  };

  window.closeQuality = function () {
    const modal = document.getElementById('quality-modal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    document.body.style.overflow = '';
    qualityItemId = null;
  };

  window.pickQuality = function (value) {
    document.getElementById('quality-input').value = value;
  };

  window.confirmQuality = async function () {
    const quality = document.getElementById('quality-input').value.trim();
    if (!qualityItemId || !quality) return;
    const btn = document.getElementById('quality-confirm');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      const res = await fetch(`/api/admin/imports/${encodeURIComponent(qualityItemId)}/quality`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          quality: quality,
          edit_caption: document.getElementById('quality-edit-caption').checked,
          retry: true
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Could not save the quality');
      closeQuality();
      loadImports();
      if (data.mapped) {
        alert(`Mapped automatically to ${data.media_type} #${data.tmdb_id}.`);
      } else {
        alert('Quality saved. The title still needs manual mapping — use Map.');
      }
    } catch (e) {
      alert(e.message || String(e));
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save quality';
    }
  };

  let retryPoll = null;

  function renderRetryStatus(s) {
    const el = document.getElementById('retry-all-status');
    const btn = document.getElementById('retry-all-btn');
    if (!el) return;
    if (s && s.running) {
      el.textContent = `Retrying ${s.processed || 0}/${s.total || 0} · fixed ${s.fixed || 0} · failed ${s.failed || 0}`;
      if (btn) btn.disabled = true;
    } else if (s && s.finished_at) {
      el.textContent = `Last retry: ${s.fixed || 0} fixed · ${s.failed || 0} still pending`;
      if (btn) btn.disabled = false;
    } else {
      el.textContent = '';
      if (btn) btn.disabled = false;
    }
  }

  async function pollRetry() {
    try {
      const res = await fetch('/api/admin/imports/retry-all/status');
      const data = await res.json();
      const s = data.status || {};
      renderRetryStatus(s);
      if (!s.running && retryPoll) {
        clearInterval(retryPoll);
        retryPoll = null;
        loadImports();
      }
    } catch (e) { /* ignore */ }
  }

  function startRetryPoll() {
    if (retryPoll) return;
    pollRetry();
    retryPoll = setInterval(pollRetry, 2500);
  }

  window.retryAllPending = async function () {
    if (!confirm('Retry every pending import with the current rules?\n\nIt runs in the background and can take a while. Already fixed items are skipped.')) return;
    try {
      const res = await fetch('/api/admin/imports/retry-all', { method: 'POST' });
      const data = await res.json().catch(() => ({}));
      showToast(data.message || 'Retry started.', data.ok ? 'success' : 'error', 'Imports');
      startRetryPoll();
    } catch (e) {
      showToast('Network error.', 'error', 'Error');
    }
  };

  document.getElementById('status-filter').addEventListener('change', function () { page = 1; loadImports(); });
  document.getElementById('search-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { page = 1; loadImports(); }
  });
  document.getElementById('map-modal').addEventListener('click', function (e) {
    if (e.target === this) closeMap();
  });
  document.getElementById('quality-modal').addEventListener('click', function (e) {
    if (e.target === this) closeQuality();
  });

  loadImports();
  pollRetry();
})();
</script>
{% endblock %}
